<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="#08090C" />
  <circle cx="256" cy="256" r="200" fill="url(#bg_glow)" opacity="0.35" />
  
  <defs>
    <linearGradient id="cyan_violet_a" x1="120" y1="90" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42E8FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="ring_grad" x1="100" y1="320" x2="440" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42E8FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <radialGradient id="bg_glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42E8FF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090C" stop-opacity="0" />
    </radialGradient>

    <filter id="logo_glow" x="20" y="20" width="472" height="472" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Back of orbital ring -->
  <path
    d="M 285 248 C 342 238 402 225 418 195 C 430 174 410 152 368 156 C 326 160 275 186 235 215"
    fill="none"
    stroke="url(#ring_grad)"
    stroke-width="14"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Main 'A' Body -->
  <g filter="url(#logo_glow)">
    <path
      d="
        M 256 84
        C 251 84 246 87 243 93
        L 125 352
        C 122 358 126 364 132 364
        L 182 364
        C 187 364 191 361 193 356
        L 218 290
        L 294 290
        L 319 356
        C 321 361 325 364 330 364
        L 380 364
        C 386 364 390 358 387 352
        L 269 93
        C 266 87 261 84 256 84
        Z
        M 256 160
        L 284 246
        L 228 246
        Z
      "
      fill="url(#cyan_violet_a)"
    />
  </g>

  <!-- Front of orbital ring -->
  <path
    d="M 110 310 C 150 300 210 274 295 246 C 355 225 405 208 424 192 C 434 180 426 164 392 168 C 358 172 308 196 256 226"
    fill="none"
    stroke="url(#ring_grad)"
    stroke-width="17"
    stroke-linecap="round"
  />

  <!-- High-contrast orbital gleam -->
  <path
    d="M 125 306 C 165 296 225 270 295 247"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Apex star -->
  <circle cx="256" cy="92" r="7" fill="#FFFFFF" opacity="0.9" />
</svg>
